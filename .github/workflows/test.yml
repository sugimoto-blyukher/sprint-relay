name: Test
on: [push, pull_request]
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Check deployment script syntax
        run: |
          for script in deploy/*.sh; do bash -n "$script"; done
      - run: python -m pip install -e '.[test]'
      - run: python -m relay check --config config.example.toml
      - run: python -m relay migrate --dry-run --config config.example.toml
      - name: Install the pinned CLI for loopback integration tests
        if: matrix.python == '3.12'
        working-directory: ${{ runner.temp }}
        run: |
          set -euo pipefail
          binary=codex-x86_64-unknown-linux-musl
          curl -fsSL --retry 3 -o codex.tar.gz "https://github.com/openai/codex/releases/download/rust-v0.172.0/$binary.tar.gz"
          echo 'a2342a8f7f68f088be30620ccfe9cb84162c93a6b56177855961cda3ed6be392  codex.tar.gz' | sha256sum -c -
          tar -xzf codex.tar.gz "$binary"
          echo "SPRINTRELAY_TEST_CODEX=$RUNNER_TEMP/$binary" >> "$GITHUB_ENV"
      - run: python -m pytest -q
