name: Linux worker containment
on: [push, pull_request]
permissions:
  contents: read

jobs:
  kernel-boundary:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install the Linux fixture toolchain
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends apparmor bubblewrap gcc libc6-dev
      - name: Allow user namespaces for the installed bubblewrap binary
        shell: bash
        run: |
          set -eu
          if [[ "$(cat /proc/sys/kernel/apparmor_restrict_unprivileged_userns 2>/dev/null || true)" == 1 ]]; then
            if [[ -f /etc/apparmor.d/bwrap ]]; then
              sudo apparmor_parser -r /etc/apparmor.d/bwrap
            else
              sudo apparmor_parser -r <<'PROFILE'
          abi <abi/4.0>,
          include <tunables/global>
          profile bwrap /usr/bin/bwrap flags=(unconfined) {
            userns,
          }
          PROFILE
            fi
          fi
      - name: Exercise the production mount layout as an unprivileged user
        run: |
          test "$(id -u)" -ne 0
          python -m pip install -e '.[test]'
          python -m pytest -q tests/test_worker.py::test_a13_kernel_mount_boundary_when_namespaces_are_available --junitxml="$RUNNER_TEMP/containment.xml"
      - name: Require an executed kernel check
        run: |
          python - <<'PY'
          import os
          from pathlib import Path
          from xml.etree import ElementTree

          report = ElementTree.parse(Path(os.environ["RUNNER_TEMP"]) / "containment.xml")
          cases = report.findall(".//testcase")
          if len(cases) != 1 or any(cases[0].find(tag) is not None for tag in ("skipped", "failure", "error")):
              raise SystemExit("The worker kernel isolation check did not pass on this runner.")
          PY
      - name: Run the native fixture under the production service restrictions
        shell: bash
        run: |
          set -euo pipefail
          test "$(id -u)" -ne 0
          fixture=$(sudo mktemp -d /var/lib/sprintrelay-fixture.XXXXXXXX)
          sudo chown "$(id -u):$(id -g)" "$fixture"
          cp -a relay tests pyproject.toml "$fixture/"
          python -m venv "$fixture/venv"
          "$fixture/venv/bin/python" -m pip install "$fixture[test]"
          # Bind the test's process to the shipped restrictions. Identity and
          # activation/exec/lifecycle belong to the fixture, not the real Worker.
          properties=()
          while IFS= read -r setting; do
            properties+=("--property=$setting")
          done < <(sed -n '/^\[Service\]$/,/^\[/p' deploy/sprintrelay-worker@.service |
            sed -n -E '/^[A-Za-z]+=/p' |
            sed -E '/^(User|Group|ExecStart|Restart|RestartSec)=/d')
          sudo systemd-run --wait --pipe --collect --uid="$(id -u)" --gid="$(id -g)" \
            "${properties[@]}" /usr/bin/bash -ec '
              cd "$1"
              report=$(mktemp /tmp/sprintrelay-test.XXXXXXXX)
              venv/bin/python -m pytest -q tests/test_worker.py::test_a13_kernel_mount_boundary_when_namespaces_are_available --junitxml="$report"
              venv/bin/python -c "import sys; from xml.etree import ElementTree as E; cases=E.parse(sys.argv[1]).findall(\".//testcase\"); assert len(cases)==1 and len(cases[0])==0, \"systemd isolation check must execute and pass\"" "$report"
            ' bash "$fixture"
