# Copy to config.toml, then replace every example ID, repository and date.
[github]
management_repo = "example/relay-management"
default_repo = "example/hackathon-product"
product_repos = ["example/hackathon-product"]
# Optional Projects v2 node ID, e.g. PVT_... (not the project number).
project_id = ""

[discord]
guild_id = "10000"
approvers = ["10101"]

[discord.channels]
meetings = "11111"
tasks = "11112"
notifications = "11113"

[[members]]
discord_id = "10101"
role = "design"

[[members]]
discord_id = "10102"
role = "design"

[[members]]
discord_id = "10103"
role = "frontend"
github = "frontend-example"

[[members]]
discord_id = "10104"
