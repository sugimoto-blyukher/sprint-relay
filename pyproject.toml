[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sprint-relay"
version = "0.1.0"
description = "Coordinate a small hackathon team through Discord and GitHub"
requires-python = ">=3.11"
dependencies = ["discord.py>=2.4,<3", "Pillow>=10", "pydantic>=2,<3"]

[project.optional-dependencies]
test = ["pytest>=8,<10"]

[tool.setuptools]
packages = ["relay"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
